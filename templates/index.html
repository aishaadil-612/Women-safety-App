<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakhi AI — Women Safety Intelligence Platform</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>

<body>
  <h2 class="sr-only">Sakhi AI — Women Safety Intelligence Platform for India</h2>
  <div class="app">
    <header class="app-header">
      <div class="header-left">
        <a href="/">
          <div class="logo">
            <img src="{{ url_for('static', filename='sakhi-shield-logo-192.png') }}" alt="Sakhi AI Logo" class="logo-img">
            <span class="logo-text">Sakhi <span class="accent-text">AI</span></span>
          </div>
        </a>
      </div>
      <nav class="app-nav" id="nav">
        <a href="/" class="nav-item active" id="nb-map" onclick="showSec('map')">
          <i class="ti ti-home"></i> <span>Home</span>
        </a>
        <a href="/map" class="nav-item" id="nb-map-page">
          <i class="ti ti-map-2"></i> <span>Map</span>
        </a>
        <a href="/analytics" class="nav-item" id="nb-analytics">
          <i class="ti ti-chart-bar"></i> <span>Analytics</span>
        </a>
        <a href="/sakhi-chat" class="nav-item" id="nb-chat">
          <i class="ti ti-message-2"></i> <span>Sakhi Chat</span>
        </a>
      </nav>
      <div class="header-right">
        <a href="/sos">
          <button class="sos-hdr-btn">
            <i class="ti ti-alert-triangle"></i> SOS Emergency
          </button>
        </a>
      </div>
    </header>

    <section id="map" class="active">
      <div class="hero">
        <div class="sidebar">
          <div class="sbhdr">
            <h2>Search State</h2>
            <div class="sbox">
              <input type="text" id="sinp" class="input-field" placeholder="e.g. Kerala, Delhi..."
                onkeydown="if(event.key==='Enter')doSearch()">
              <button onclick="doSearch()"><i class="ti ti-search"></i></button>
            </div>
          </div>
          <div id="sres"></div>
          <div class="slist" id="slist"></div>
        </div>
        <div class="maparea">
          <canvas id="indiamap"></canvas>
          <div class="tooltip" id="tip">
            <div class="ttitle" id="ttitle"></div>
            <div class="trow"><span class="tlab">Safety Score</span><span class="tval" id="tscore"></span></div>
            <div class="trow"><span class="tlab">Risk Level</span><span class="tval" id="trisk"></span></div>
            <div class="trow"><span class="tlab">Crime Rate</span><span class="tval" id="trate"></span></div>
          </div>
          <div class="legend">
            <h3>Risk Legend</h3>
            <div class="li">
              <div class="ldot" style="background:#22c55e"></div>Low Risk (≥60)
            </div>
            <div class="li">
              <div class="ldot" style="background:#f59e0b"></div>Medium Risk (30–59)
            </div>
            <div class="li">
              <div class="ldot" style="background:#ef4444"></div>High Risk (&lt;30)
            </div>
          </div>
        </div>
      </div>
    </section>

afety levels — stay alert"] }, { "state": "Puducherry", "safety_score": 68.1, "risk_level": "Low Risk", "crime_rate": 25.84, "total_crimes": 351, "trend_years": [2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023], "trend_rates": [34.97, 30.79, 32.42, 28.28, 33.63, 24.99, 29.32, 26.35, 30.95, 25.84], "crime_breakdown": { "Rape": 37, "Kidnapping_&_Abduction": 19, "Dowry_Deaths": 80, "Assault_on_Women": 40, "Insult_to_Modesty": 72, "Cruelty_by_Husband_Relatives": 56, "Trafficking": 17, "Cyber_Crimes_Against_Women": 26 }, "recommendations": ["✅ Puducherry has relatively low crime rates — stay vigilant"] }], "national": { "years": [2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023], "rates": [45.43, 44.17, 43.69, 42.62, 40.95, 39.7, 39.02, 39.54, 37.65, 36.77] }, "crime_breakdown": { "Rape": 78598, "Kidnapping & Abduction": 70053, "Dowry Deaths": 59609, "Assault on Women": 68685, "Insult to Modesty": 57570, "Cruelty by Husband/Relatives": 88856, "Trafficking": 80652, "Cyber Crimes Against Women": 70968 } };

      const states = APP_DATA.states;
      const stateMap = {};
      states.forEach(s => stateMap[s.state] = s);

      function riskColor(rl) { return rl === 'Low Risk' ? '#22c55e' : rl === 'Medium Risk' ? '#f59e0b' : '#ef4444' }
      function riskBadge(rl) { return rl === 'Low Risk' ? 'rL' : rl === 'Medium Risk' ? 'rM' : 'rH' }
      function riskIcon(rl) { return rl === 'Low Risk' ? '✅' : rl === 'Medium Risk' ? '⚠️' : '🚨' }

      function showSec(id) {
        document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('nav .nav-item').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('nb-' + id)?.classList.add('active');
        if (id === 'dash') initDash();
        if (id === 'chat') initChat();
      } function buildStatesList() {
        const sorted = [...states].sort((a, b) => b.safety_score - a.safety_score);
        document.getElementById('slist').innerHTML = sorted.map(s => `
    <div class="si" onclick="quickSearch('${s.state}')">
      <div class="sdot" style="background:${riskColor(s.risk_level)}"></div>
      <div class="sn">${s.state}</div>
      <div class="sc" style="color:${riskColor(s.risk_level)}">${s.safety_score.toFixed(0)}</div>
    </div>`).join('');
      }

      function quickSearch(name) {
        document.getElementById('sinp').value = name;
        doSearch();
      }

      function doSearch() {
        const q = document.getElementById('sinp').value.trim().toLowerCase();
        if (!q) return;
        const found = states.find(s => s.state.toLowerCase().includes(q));
        const sres = document.getElementById('sres');
        if (!found) { sres.innerHTML = '<div style="color:#ef4444;font-size:11px;padding:4px 0">No state found. Try again.</div>'; sres.style.display = 'block'; return }
        const c = riskColor(found.risk_level);
        const icon = riskIcon(found.risk_level);
        const recs = found.recommendations.slice(0, 3).map(r => `<p>${r}</p>`).join('');
        sres.style.display = 'block';
        sres.innerHTML = `<div class="rc">
    <div class="rstate">${icon} ${found.state}</div>
    <span class="rbadge ${riskBadge(found.risk_level)}">${found.risk_level}</span>
    <div><span class="rscore" style="color:${c}">${found.safety_score.toFixed(0)}</span><span style="font-size:10px;color:var(--ts)"> / 100</span></div>
    <div class="rinfo">Crime Rate: ${found.crime_rate.toFixed(1)} per lakh women</div>
    <div class="rrec"><h4>Recommendations</h4>${recs}</div>
  </div>`;
      }

      const STATE_POSITIONS = {
        "Uttar Pradesh": [0.54, 0.38], "Rajasthan": [0.37, 0.42], "Maharashtra": [0.43, 0.58], "Madhya Pradesh": [0.47, 0.50],
        "West Bengal": [0.74, 0.45], "Odisha": [0.65, 0.55], "Delhi": [0.46, 0.33], "Assam": [0.84, 0.35],
        "Haryana": [0.44, 0.31], "Bihar": [0.67, 0.40], "Jharkhand": [0.69, 0.48], "Andhra Pradesh": [0.57, 0.68],
        "Telangana": [0.54, 0.63], "Chhattisgarh": [0.58, 0.53], "Karnataka": [0.48, 0.72], "Gujarat": [0.32, 0.52],
        "Tamil Nadu": [0.52, 0.80], "Punjab": [0.40, 0.26], "Uttarakhand": [0.50, 0.28], "Himachal Pradesh": [0.46, 0.23],
        "Kerala": [0.47, 0.85], "Goa": [0.40, 0.72], "Tripura": [0.82, 0.44], "Meghalaya": [0.81, 0.38],
        "Manipur": [0.88, 0.38], "Nagaland": [0.90, 0.34], "Arunachal Pradesh": [0.89, 0.27], "Mizoram": [0.85, 0.44],
        "Sikkim": [0.80, 0.32], "Jammu & Kashmir": [0.43, 0.18], "Chandigarh": [0.43, 0.28], "Puducherry": [0.55, 0.77]
      };

      function drawMap() {
        const canvas = document.getElementById('indiamap');
        if (!canvas) return;
        const parent = canvas.parentElement;
        canvas.width = parent.clientWidth || 600;
        canvas.height = parent.clientHeight || 500;
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;
        ctx.fillStyle = '#0a0a1a';
        ctx.fillRect(0, 0, W, H);
        const tip = document.getElementById('tip');
        const INDIA_OUTLINE = [
          [0.33, 0.18], [0.42, 0.15], [0.55, 0.13], [0.67, 0.16], [0.74, 0.20], [0.90, 0.25], [0.95, 0.35],
          [0.90, 0.42], [0.85, 0.50], [0.78, 0.60], [0.70, 0.70], [0.60, 0.82], [0.53, 0.88], [0.47, 0.92],
          [0.40, 0.85], [0.35, 0.75], [0.30, 0.65], [0.27, 0.58], [0.28, 0.48], [0.30, 0.38], [0.33, 0.28], [0.33, 0.18]
        ];
        ctx.beginPath();
        INDIA_OUTLINE.forEach(([px, py], i) => {
          const x = px * W, y = py * H;
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.fillStyle = 'rgba(168,85,247,0.06)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(168,85,247,0.25)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        const dots = [];
        states.forEach(s => {
          const pos = STATE_POSITIONS[s.state];
          if (!pos) return;
          const [px, py] = pos;
          const x = px * W, y = py * H;
          const score = s.safety_score;
          const color = riskColor(s.risk_level);
          const r = Math.max(6, Math.min(18, 6 + (100 - score) * 0.14));
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = color + '40';
          ctx.fill();
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.fillStyle = color;
          ctx.font = `500 ${Math.max(8, Math.min(10, r * 0.8))}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(score.toFixed(0), x, y);
          dots.push({ x, y, r: r + 3, state: s });
        });
        canvas.onmousemove = function (e) {
          const rect = canvas.getBoundingClientRect();
          const mx = e.clientX - rect.left, my = e.clientY - rect.top;
          let found = null;
          dots.forEach(d => {
            const dx = mx - d.x, dy = my - d.y;
            if (Math.sqrt(dx * dx + dy * dy) < d.r) found = d;
          });
          if (found) {
            const s = found.state;
            document.getElementById('ttitle').textContent = riskIcon(s.risk_level) + ' ' + s.state;
            document.getElementById('tscore').textContent = s.safety_score.toFixed(1) + '/100';
            document.getElementById('trisk').style.color = riskColor(s.risk_level);
            document.getElementById('trisk').textContent = s.risk_level;
            document.getElementById('trate').textContent = s.crime_rate.toFixed(1) + ' per lakh';
            tip.style.opacity = '1';
            tip.style.left = (found.x + 15) + 'px';
            tip.style.top = (found.y - 20) + 'px';
            canvas.style.cursor = 'pointer';
          } else {
            tip.style.opacity = '0';
            canvas.style.cursor = 'default';
          }
        };
        canvas.onclick = function (e) {
          const rect = canvas.getBoundingClientRect();
          const mx = e.clientX - rect.left, my = e.clientY - rect.top;
          dots.forEach(d => {
            const dx = mx - d.x, dy = my - d.y;
            if (Math.sqrt(dx * dx + dy * dy) < d.r) quickSearch(d.state.state);
          });
        };
        canvas.onmouseleave = function () { tip.style.opacity = '0' };
      }

      buildStatesList();
      drawMap();
      window.addEventListener('resize', () => drawMap());
    </script>
