:root{
--bg:#0a0a1a;--card:#111128;--panel:#161635;--border:rgba(168,85,247,0.18);
--accent:#a855f7;--rose:#f43f5e;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;
--tp:var(--color-text-primary);--ts:var(--color-text-secondary);--tm:#64748b;
}
body{background:var(--bg);color:var(--tp);font-family:var(--font-sans);min-height:100vh;color:white}
.app{display:flex;
  flex-direction:column;
  min-height:100vh;
  background:var(--bg)}
header{background:rgba(111, 29, 114, 0.96);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50 ; color:white}
.logo{font-size:17px;font-weight:500;background:linear-gradient(135deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:7px}
.logo-icon{width:28px;height:28px;background:linear-gradient(135deg,#a855f7,#ec4899);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
nav{display:flex;gap:2px}
nav button{background:none;border:none;color:var(--ts);padding:5px 11px;border-radius:7px;font-size:12px;cursor:pointer;transition:all .15s}
nav button:hover,nav button.active{color:var(--tp);background:rgba(168,85,247,0.18)}
.sos-hdr{background:#dc2626;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;animation:pr 2s infinite;transition:transform .15s}
.sos-hdr:hover{transform:scale(1.04)}
@keyframes pr{0%,100%{box-shadow:0 0 14px rgba(220,38,38,0.5)}50%{box-shadow:0 0 28px rgba(220,38,38,0.8)}}
section{display:none;flex:1}
section.active{display:flex;flex-direction:column}
.hero{display:grid;grid-template-columns:300px 1fr;flex:1;min-height:0}
.sidebar{background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sbhdr{padding:14px;border-bottom:1px solid var(--border)}
.sbox{display:flex;gap:6px}
.sbox input{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--tp);font-size:12px;outline:none;transition:border-color .15s}
.sbox input:focus{border-color:var(--accent)}
.sbox input::placeholder{color:var(--tm)}
.sbox button{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:7px 11px;cursor:pointer;font-size:13px}
#sres{padding:12px;border-bottom:1px solid var(--border);display:none}
.rc{background:var(--panel);border-radius:9px;padding:12px;border:1px solid var(--border)}
.rstate{font-size:14px;font-weight:500;margin-bottom:6px}
.rbadge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500;margin-bottom:8px}
.rL{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3)}
.rM{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
.rH{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3)}
.rscore{font-size:28px;font-weight:700}
.rinfo{font-size:10px;color:var(--ts);margin-top:2px}
.rrec{margin-top:8px}
.rrec h4{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--tm);margin-bottom:4px}
.rrec p{font-size:10px;color:var(--ts);line-height:1.45;padding:2px 0}
.slist{flex:1;overflow-y:auto;padding:8px}
.slist::-webkit-scrollbar{width:3px}
.slist::-webkit-scrollbar-thumb{background:var(--border)}
.si{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;transition:background .12s}
.si:hover{background:var(--panel)}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sn{font-size:12px;flex:1}
.sc{font-size:11px;font-weight:500}
.maparea{flex:1;position:relative;overflow:hidden}
canvas#indiamap{width:100%;height:100%}
.tooltip{position:absolute;background:rgba(17,17,40,.95);border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:11px;pointer-events:none;opacity:0;transition:opacity .2s;max-width:200px;z-index:10}
.ttitle{font-size:13px;font-weight:500;margin-bottom:6px}
.trow{display:flex;justify-content:space-between;gap:16px;padding:2px 0}
.tlab{color:var(--ts)}
.tval{font-weight:500}
.legend{position:absolute;bottom:16px;left:16px;background:rgba(17,17,40,.92);border:1px solid var(--border);border-radius:9px;padding:10px 12px}
.legend h3{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--ts);margin-bottom:8px}
.li{display:flex;align-items:center;gap:7px;margin:4px 0;font-size:10px;color:var(--ts)}
.ldot{width:10px;height:10px;border-radius:50%}
#dash{padding:24px;overflow-y:auto}
.dh{font-size:22px;font-weight:500;margin-bottom:4px}
.ds{font-size:12px;color:var(--ts);margin-bottom:20px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.mc{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:16px;position:relative;overflow:hidden}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.mcP::before{background:linear-gradient(90deg,#a855f7,#ec4899)}
.mcG::before{background:#22c55e}.mcR::before{background:#ef4444}.mcY::before{background:#f59e0b}
.mcl{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--tm);margin-bottom:6px}
.mcv{font-size:26px;font-weight:500;line-height:1;margin-bottom:3px}
.mcs{font-size:10px;color:var(--ts)}
.cg2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.cg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.cc{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:16px}
.cc h3{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--ts);margin-bottom:12px}
.cw{height:180px;position:relative}
.ri{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.rn{font-size:10px;color:var(--tm);width:16px;text-align:center}
.rnm{flex:1;font-size:12px;font-weight:500}
.rsc{font-size:11px;font-weight:500;padding:2px 7px;border-radius:5px}

    </style>
</head>

const states = APP_DATA.states;
const stateMap = {};
states.forEach(s => stateMap[s.state] = s);

function riskColor(rl){return rl==='Low Risk'?'#22c55e':rl==='Medium Risk'?'#f59e0b':'#ef4444'}
function riskBadge(rl){return rl==='Low Risk'?'rL':rl==='Medium Risk'?'rM':'rH'}
function riskIcon(rl){return rl==='Low Risk'?'✅':rl==='Medium Risk'?'⚠️':'🚨'}

function showSec(id){
  document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('nb-'+id)?.classList.add('active');
  if(id==='dash') initDash();
  if(id==='chat') initChat();
}function buildStatesList(){
  const sorted=[...states].sort((a,b)=>b.safety_score-a.safety_score);
  document.getElementById('slist').innerHTML=sorted.map(s=>`
    <div class="si" onclick="quickSearch('${s.state}')">
      <div class="sdot" style="background:${riskColor(s.risk_level)}"></div>
      <div class="sn">${s.state}</div>
      <div class="sc" style="color:${riskColor(s.risk_level)}">${s.safety_score.toFixed(0)}</div>
    </div>`).join('');
}

function quickSearch(name){
  document.getElementById('sinp').value=name;
  doSearch();
}

function doSearch(){
  const q=document.getElementById('sinp').value.trim().toLowerCase();
  if(!q) return;
  const found=states.find(s=>s.state.toLowerCase().includes(q));
  const sres=document.getElementById('sres');
  if(!found){sres.innerHTML='<div style="color:#ef4444;font-size:11px;padding:4px 0">No state found. Try again.</div>';sres.style.display='block';return}
  const c=riskColor(found.risk_level);
  const icon=riskIcon(found.risk_level);
  const recs=found.recommendations.slice(0,3).map(r=>`<p>${r}</p>`).join('');
  sres.style.display='block';
  sres.innerHTML=`<div class="rc">
    <div class="rstate">${icon} ${found.state}</div>
    <span class="rbadge ${riskBadge(found.risk_level)}">${found.risk_level}</span>
    <div><span class="rscore" style="color:${c}">${found.safety_score.toFixed(0)}</span><span style="font-size:10px;color:var(--ts)"> / 100</span></div>
    <div class="rinfo">Crime Rate: ${found.crime_rate.toFixed(1)} per lakh women</div>
    <div class="rrec"><h4>Recommendations</h4>${recs}</div>
  </div>`;
}

const STATE_POSITIONS = {
  "Uttar Pradesh":[0.54,0.38],"Rajasthan":[0.37,0.42],"Maharashtra":[0.43,0.58],"Madhya Pradesh":[0.47,0.50],
  "West Bengal":[0.74,0.45],"Odisha":[0.65,0.55],"Delhi":[0.46,0.33],"Assam":[0.84,0.35],
  "Haryana":[0.44,0.31],"Bihar":[0.67,0.40],"Jharkhand":[0.69,0.48],"Andhra Pradesh":[0.57,0.68],
  "Telangana":[0.54,0.63],"Chhattisgarh":[0.58,0.53],"Karnataka":[0.48,0.72],"Gujarat":[0.32,0.52],
  "Tamil Nadu":[0.52,0.80],"Punjab":[0.40,0.26],"Uttarakhand":[0.50,0.28],"Himachal Pradesh":[0.46,0.23],
  "Kerala":[0.47,0.85],"Goa":[0.40,0.72],"Tripura":[0.82,0.44],"Meghalaya":[0.81,0.38],
  "Manipur":[0.88,0.38],"Nagaland":[0.90,0.34],"Arunachal Pradesh":[0.89,0.27],"Mizoram":[0.85,0.44],
  "Sikkim":[0.80,0.32],"Jammu & Kashmir":[0.43,0.18],"Chandigarh":[0.43,0.28],"Puducherry":[0.55,0.77]
};

function drawMap(){
  const canvas=document.getElementById('indiamap');
  if(!canvas) return;
  const parent=canvas.parentElement;
  canvas.width=parent.clientWidth||600;
  canvas.height=parent.clientHeight||500;
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.fillStyle='#0a0a1a';
  ctx.fillRect(0,0,W,H);
  const tip=document.getElementById('tip');
  const INDIA_OUTLINE=[
    [0.33,0.18],[0.42,0.15],[0.55,0.13],[0.67,0.16],[0.74,0.20],[0.90,0.25],[0.95,0.35],
    [0.90,0.42],[0.85,0.50],[0.78,0.60],[0.70,0.70],[0.60,0.82],[0.53,0.88],[0.47,0.92],
    [0.40,0.85],[0.35,0.75],[0.30,0.65],[0.27,0.58],[0.28,0.48],[0.30,0.38],[0.33,0.28],[0.33,0.18]
  ];
  ctx.beginPath();
  INDIA_OUTLINE.forEach(([px,py],i)=>{
    const x=px*W, y=py*H;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.closePath();
  ctx.fillStyle='rgba(168,85,247,0.06)';
  ctx.fill();
  ctx.strokeStyle='rgba(168,85,247,0.25)';
  ctx.lineWidth=1.5;
  ctx.stroke();
  const dots=[];
  states.forEach(s=>{
    const pos=STATE_POSITIONS[s.state];
    if(!pos) return;
    const [px,py]=pos;
    const x=px*W, y=py*H;
    const score=s.safety_score;
    const color=riskColor(s.risk_level);
    const r=Math.max(6, Math.min(18, 6+(100-score)*0.14));
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=color+'40';
    ctx.fill();
    ctx.strokeStyle=color;
    ctx.lineWidth=1.5;
    ctx.stroke();
    ctx.fillStyle=color;
    ctx.font=`500 ${Math.max(8,Math.min(10,r*0.8))}px sans-serif`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(score.toFixed(0),x,y);
    dots.push({x,y,r:r+3,state:s});
  });
  canvas.onmousemove=function(e){
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    let found=null;
    dots.forEach(d=>{
      const dx=mx-d.x, dy=my-d.y;
      if(Math.sqrt(dx*dx+dy*dy)<d.r) found=d;
    });
    if(found){
      const s=found.state;
      document.getElementById('ttitle').textContent=riskIcon(s.risk_level)+' '+s.state;
      document.getElementById('tscore').textContent=s.safety_score.toFixed(1)+'/100';
      document.getElementById('trisk').style.color=riskColor(s.risk_level);
      document.getElementById('trisk').textContent=s.risk_level;
      document.getElementById('trate').textContent=s.crime_rate.toFixed(1)+' per lakh';
      tip.style.opacity='1';
      tip.style.left=(found.x+15)+'px';
      tip.style.top=(found.y-20)+'px';
      canvas.style.cursor='pointer';
    } else {
      tip.style.opacity='0';
      canvas.style.cursor='default';
    }
  };
  canvas.onclick=function(e){
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    dots.forEach(d=>{
      const dx=mx-d.x, dy=my-d.y;
      if(Math.sqrt(dx*dx+dy*dy)<d.r) quickSearch(d.state.state);
    });
  };
  canvas.onmouseleave=function(){tip.style.opacity='0'};
}

buildStatesList();
drawMap();
window.addEventListener('resize',()=>drawMap());
</script>
