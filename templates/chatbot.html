<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakhi AI Chat — Safety companion</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <a href="/">
        <div class="logo">
          <img src="{{ url_for('static', filename='sakhi-shield-logo-192.png') }}" alt="Sakhi AI Logo" class="logo-img">
          <span class="logo-text">Sakhi <span class="accent-text">AI</span></span>
        </div>
      </a>
    </div>
    <nav class="app-nav" id="nav">
      <a href="/" class="nav-item" id="nb-map">
        <i class="ti ti-home"></i> <span>Home</span>
      </a>
      <a href="/map" class="nav-item" id="nb-map-page">
        <i class="ti ti-map-2"></i> <span>Map</span>
      </a>
      <a href="/analytics" class="nav-item" id="nb-analytics">
        <i class="ti ti-chart-bar"></i> <span>Analytics</span>
      </a>
      <a href="/sakhi-chat" class="nav-item active" id="nb-chat">
        <i class="ti ti-message-2"></i> <span>Sakhi Chat</span>
      </a>
    </nav>
    <div class="header-right">
      <a href="/sos">
        <button class="sos-hdr-btn">
          <i class="ti ti-alert-triangle"></i> SOS Emergency
        </button>
      </a>
    </div>
  </header>

<div class="sakhi-app" id="sakhiApp">

  <div class="sakhi-header">
    <div class="sakhi-logo"><i class="ti ti-shield-heart" aria-hidden="true"></i></div>
    <div class="sakhi-title">
      <h1>Sakhi AI <span style="font-size:11px; opacity:0.8;">✦ Women Safety Intelligence</span></h1>
      <p><span class="status-dot"></span>Active & Monitoring · India Safety Platform</p>
    </div>
    <div class="header-actions">
      <button class="header-btn" onclick="toggleTTS()" title="Toggle voice output" id="ttsBtn">
        <i class="ti ti-volume" aria-hidden="true"></i>
      </button>
      <button class="header-btn sos-btn-header" onclick="activateSOS()" aria-label="SOS Emergency">
        <i class="ti ti-alert-triangle" aria-hidden="true"></i> SOS
      </button>
    </div>
  </div>

  <div class="search-bar-container">
    <div class="search-bar">
      <i class="ti ti-map-pin search-icon" aria-hidden="true"></i>
      <input type="text" id="locationSearch" placeholder="Search safety score for any city or state in India..." />
      <button class="search-submit" onclick="searchLocation()">Check</button>
    </div>
  </div>

  <div class="quick-actions">
    <button class="qa-btn purple" onclick="sendQuick('Show me the safety map')">
      <i class="ti ti-map" aria-hidden="true"></i> Safety Map
    </button>
    <button class="qa-btn" onclick="sendQuick('Which states are high risk for women?')">
      <i class="ti ti-chart-bar" aria-hidden="true"></i> High Risk States
    </button>
    <button class="qa-btn" onclick="sendQuick('Give me safety tips for travel')">
      <i class="ti ti-bulb" aria-hidden="true"></i> Safety Tips
    </button>
    <button class="qa-btn" onclick="sendQuick('Show emergency contacts')">
      <i class="ti ti-phone" aria-hidden="true"></i> Emergency Contacts
    </button>
    <button class="qa-btn danger" onclick="activateSOS()">
      <i class="ti ti-alert-triangle" aria-hidden="true"></i> Activate SOS
    </button>
  </div>

  <div class="chat-area" id="chatArea"></div>

  <div class="voice-status" id="voiceStatus">
    <i class="ti ti-microphone" aria-hidden="true"></i> Listening... speak now
  </div>

  <div class="input-area">
    <button class="mic-btn" id="micBtn" onclick="toggleVoice()" title="Voice input" aria-label="Toggle microphone">
      <i class="ti ti-microphone" aria-hidden="true"></i>
    </button>
    <div class="input-wrap">
      <textarea id="msgInput" rows="1" placeholder='Ask about safety, type "help me" for SOS...' onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    </div>
    <button class="send-btn" onclick="sendMessage()" aria-label="Send message">
      <i class="ti ti-send" aria-hidden="true"></i>
    </button>
  </div>

  <div class="sos-overlay" id="sosOverlay">
    <div class="sos-modal">
      <div class="sos-pulse"><i class="ti ti-alert-triangle" aria-hidden="true"></i></div>
      <h2>SOS Activated</h2>
      <p>Emergency services are being alerted. Stay calm and stay on the line.</p>
      <div class="sos-actions">
        <button class="sos-call" onclick="callEmergency()">
          <i class="ti ti-phone" aria-hidden="true"></i> Call 112
        </button>
        <button class="sos-dismiss" onclick="dismissSOS()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script>
const SAFETY_DATA = {

    "karnataka": { score: 63, level: "medium", crimes: 12803, rank: 9, tips: ["Use Suraksha app","Metro is safer than autos","Travel during peak hours"] },

    "himachal pradesh": { score: 78, level: "low", crimes: 1240, rank: 12, tips: ["Safe but be cautious in remote areas","Local police are helpful","Carry ID always"] },
    "sikkim": { score: 85, level: "low", crimes: 310, rank: 13, tips: ["Generally very safe","Report anything suspicious","Tourist police available"] },
    "goa": { score: 66, level: "medium", crimes: 2870, rank: 10, tips: ["Tourist areas are monitored","Avoid isolated beaches at night","Emergency: 0832-2423100"] },
    "punjab": { score: 50, level: "medium", crimes: 18420, rank: 7, tips: ["Use police helpline 1091","Prefer daytime travel","Stay with known groups"] },
    "bihar": { score: 32, level: "high", crimes: 28940, rank: 3, tips: ["Extra caution required","Travel only in groups","Avoid night travel"] },
    "jharkhand": { score: 36, level: "high", crimes: 17230, rank: 4, tips: ["Use GPS sharing","Avoid remote areas","Contact family frequently"] },
    "haryana": { score: 42, level: "high", crimes: 14890, rank: 5, tips: ["Durga Shakti helpline 1008","Prefer public transport","Trust licensed transport only"] },
  },
  cities: {
    "lucknow": { state: "uttar pradesh", score: 34, level: "high", crimes: 5230 },
    "mumbai": { state: "maharashtra", score: 58, level: "medium", crimes: 8120 },
    "delhi": { state: "delhi", score: 35, level: "high", crimes: 14247 },
    "bangalore": { state: "karnataka", score: 64, level: "medium", crimes: 4380 },
    "hyderabad": { state: "telangana", score: 61, level: "medium", crimes: 3920 },
    "chennai": { state: "tamil nadu", score: 67, level: "medium", crimes: 2870 },
    "kolkata": { state: "west bengal", score: 54, level: "medium", crimes: 6120 },
    "pune": { state: "maharashtra", score: 60, level: "medium", crimes: 3210 },
    "ahmedabad": { state: "gujarat", score: 69, level: "medium", crimes: 2890 },
    "jaipur": { state: "rajasthan", score: 40, level: "high", crimes: 7320 },
    "kochi": { state: "kerala", score: 75, level: "low", crimes: 1230 },
    "chandigarh": { state: "punjab", score: 62, level: "medium", crimes: 1840 },
    "bhopal": { state: "madhya pradesh", score: 38, level: "high", crimes: 4210 },
    "patna": { state: "bihar", score: 30, level: "high", crimes: 5670 },
    "surat": { state: "gujarat", score: 70, level: "medium", crimes: 2100 },
    "agra": { state: "uttar pradesh", score: 31, level: "high", crimes: 3870 },
    "varanasi": { state: "uttar pradesh", score: 33, level: "high", crimes: 3420 },
    "indore": { state: "madhya pradesh", score: 41, level: "high", crimes: 3780 },
    "nagpur": { state: "maharashtra", score: 57, level: "medium", crimes: 2940 },
    "visakhapatnam": { state: "andhra pradesh", score: 59, level: "medium", crimes: 2310 },
  }
};

const RESPONSES = {
  greet: () => `Hello! 🌸 I'm **Sakhi AI**, your personal women's safety assistant. I'm here to help keep you safe.\n\nAre you safe right now? How can I help you today?`,
  safety_tips: () => `Here are essential safety tips for women:\n\n1. **Stay aware** — trust your instincts, if something feels wrong it probably is\n2. **Share location** — use Google Maps or WhatsApp live location with trusted contacts\n3. **Safe transport** — prefer verified cabs (Ola/Uber), note vehicle number before boarding\n4. **Emergency numbers** — 112 (Emergency), 1091 (Women Helpline), 181 (Women in Distress)\n5. **Night safety** — stay on main roads, avoid shortcuts, travel in groups when possible\n6. **Digital safety** — enable phone password, don't overshare location on social media`,
  emergency_contacts: () => null,
  unsafe: () => `I hear you, and your safety matters. Let me help immediately:\n\n• **Call 112** — national emergency (police + ambulance)\n• **Women Helpline: 1091** — 24/7 support\n• **WhatsApp SOS** — update your status with location\n\nShould I activate the emergency SOS now?`,
  sos_voice: () => null,
  high_risk_states: () => null,
};

let ttsEnabled = true;
let isListening = false;
let recognition = null;
let synth = window.speechSynthesis;

function getSafetyData(query) {
  const q = query.toLowerCase().trim();
  const cityData = SAFETY_DATA.cities[q];
  if (cityData) return { name: q.charAt(0).toUpperCase()+q.slice(1), type: 'city', ...cityData };
  for (const [city, data] of Object.entries(SAFETY_DATA.cities)) {
    if (q.includes(city)) return { name: city.charAt(0).toUpperCase()+city.slice(1), type: 'city', ...data };
  }
  const stateData = SAFETY_DATA.states[q];
  if (stateData) return { name: q.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' '), type: 'state', ...stateData };
  for (const [state, data] of Object.entries(SAFETY_DATA.states)) {
    if (q.includes(state) || state.includes(q)) return { name: state.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' '), type: 'state', ...data };
  }
  return null;
}

function getRiskEmoji(level) {
  return level === 'high' ? '🔴' : level === 'medium' ? '🟡' : '🟢';
}
function getRiskClass(level) {
  return level === 'high' ? 'risk-high' : level === 'medium' ? 'risk-medium' : 'risk-low';
}
function getBarClass(level) {
  return level === 'high' ? 'fill-red' : level === 'medium' ? 'fill-yellow' : 'fill-green';
}
function getRiskLabel(level) {
  return level === 'high' ? 'High Risk' : level === 'medium' ? 'Medium Risk' : 'Low Risk';
}

function buildSafetyCard(data, query) {
  const tips = data.tips || SAFETY_DATA.states[data.state]?.tips || ['Stay alert','Share your location','Keep emergency numbers handy'];
  return `
<div class="safety-card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
    <div>
      <div style="font-size:15px;font-weight:500;color:var(--color-text-primary);">${getRiskEmoji(data.level)} ${data.name}</div>
      <div style="font-size:11px;color:var(--color-text-secondary);margin-top:2px;">${data.type === 'city' ? 'City · '+data.state.split(' ').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ') : 'State'}</div>
    </div>
    <span class="risk-badge ${getRiskClass(data.level)}">${getRiskLabel(data.level)}</span>
  </div>
  <div class="score-bar-wrap">
    <div class="score-label"><span>Safety Score</span><span style="font-weight:500;">${data.score}/100</span></div>
    <div class="score-bar"><div class="score-fill ${getBarClass(data.level)}" style="width:${data.score}%"></div></div>
  </div>
  <div class="stat-grid">
    <div class="stat-item"><div class="stat-val">${data.score}</div><div class="stat-lbl">Safety Score</div></div>
    <div class="stat-item"><div class="stat-val">${data.crimes?.toLocaleString()}</div><div class="stat-lbl">Reported crimes/yr</div></div>
  </div>
  <div style="margin-top:10px;">
    <div style="font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-bottom:5px;">Safety recommendations</div>
    ${tips.map(t => `<div style="font-size:12px;color:var(--color-text-primary);padding:3px 0;display:flex;gap:6px;"><span style="color:#7c3aed;">•</span>${t}</div>`).join('')}
  </div>
</div>`;
}

function buildEmergencyCard() {
  return `
<div class="sos-card">
  <h3><i class="ti ti-phone-call" aria-hidden="true"></i> Emergency Contacts India</h3>
  ${[
    ['112','National Emergency (Police/Ambulance/Fire)'],
    ['1091','Women Helpline (24/7)'],
    ['181','Women in Distress Helpline'],
    ['100','Police'],
    ['102','Ambulance'],
    ['1098','Child Helpline']
  ].map(([num, label]) => `<div class="sos-step"><div class="sos-num">${num.length <= 3 ? '📞' : '#'}</div><div><strong>${num}</strong> — ${label}</div></div>`).join('')}
  <div style="margin-top:10px;padding-top:8px;border-top:0.5px solid #fca5a5;font-size:11.5px;color:#991b1b;">Tap SOS button above to instantly alert emergency contacts</div>
</div>`;
}

function buildHighRiskCard() {
  const highRisk = Object.entries(SAFETY_DATA.states)
    .filter(([,d]) => d.level === 'high')
    .sort((a,b) => a[1].score - b[1].score)
    .slice(0, 6);
  const medRisk = Object.entries(SAFETY_DATA.states).filter(([,d]) => d.level === 'medium').length;
  const lowRisk = Object.entries(SAFETY_DATA.states).filter(([,d]) => d.level === 'low').length;
  return `
<div class="safety-card">
  <div style="font-size:13px;font-weight:500;margin-bottom:10px;">India Women Safety Risk Overview</div>
  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <span class="risk-badge risk-high">${highRisk.length} High Risk</span>
    <span class="risk-badge risk-medium">${medRisk} Medium Risk</span>
    <span class="risk-badge risk-low">${lowRisk} Low Risk</span>
  </div>
  <div class="risk-list">
    <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:5px;">Highest concern states</div>
    ${highRisk.map(([name, data]) => `
    <div class="risk-row">
      <span style="font-weight:500;">${name.split(' ').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ')}</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:60px;height:5px;border-radius:3px;background:var(--color-border-tertiary);overflow:hidden;"><div style="width:${data.score}%;height:100%;background:#ef4444;border-radius:3px;"></div></div>
        <span class="risk-badge risk-high" style="font-size:11px;padding:2px 7px;">${data.score}/100</span>
      </div>
    </div>`).join('')}
  </div>
  <div style="margin-top:8px;font-size:11.5px;color:var(--color-text-tertiary);">Data based on NCRB Crime in India report</div>
</div>`;
}

function buildMapCard() {
  return `
<div class="safety-card">
  <div style="font-size:13px;font-weight:500;margin-bottom:8px;"><i class="ti ti-map" aria-hidden="true"></i> India Women Safety Map</div>
  <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:14px;text-align:center;border:0.5px dashed var(--color-border-secondary);">
    <div style="font-size:24px;margin-bottom:8px;">🗺️</div>
    <div style="font-size:13px;color:var(--color-text-primary);font-weight:500;">India Women Safety Choropleth Map</div>
    <div style="font-size:12px;color:var(--color-text-secondary);margin:4px 0 12px;">Interactive heatmap showing crime density by state & district</div>
    <button onclick="sendQuick('Which states are high risk for women?')" style="background:#7c3aed;color:white;border:none;padding:8px 16px;border-radius:16px;font-size:12px;cursor:pointer;">View High Risk States</button>
  </div>
  <div class="tip-chips" style="margin-top:10px;">
    <span class="tip-chip" onclick="searchFor('Lucknow')">🔍 Lucknow</span>
    <span class="tip-chip" onclick="searchFor('Mumbai')">🔍 Mumbai</span>
    <span class="tip-chip" onclick="searchFor('Delhi')">🔍 Delhi</span>
    <span class="tip-chip" onclick="searchFor('Kerala')">🔍 Kerala</span>
  </div>
</div>`;
}

function searchFor(loc) {
  document.getElementById('locationSearch').value = loc;
  searchLocation();
}

let chatHistory = [];
let isTyping = false;

function addMessage(type, content, html = '') {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  
  const textContent = content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
  
  div.innerHTML = type === 'bot' 
    ? `<div class="avatar"><i class="ti ti-shield-heart" aria-hidden="true"></i></div><div><div class="bubble">${textContent}</div>${html}</div>`
    : `<div class="bubble">${textContent}</div>`;
  
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  
  if (type === 'bot' && ttsEnabled && content.length < 300) speak(content.replace(/\*\*(.*?)\*\*/g, '$1').split('\n')[0]);
  return div;
}

function showTyping() {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg bot'; div.id = 'typingIndicator';
  div.innerHTML = `<div class="avatar"><i class="ti ti-shield-heart" aria-hidden="true"></i></div><div class="bubble typing"><span></span><span></span><span></span></div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

async function processMessage(text) {
  if (isTyping) return;
  isTyping = true;
  
  const lower = text.toLowerCase();
  showTyping();
  await new Promise(r => setTimeout(r, 600 + Math.random() * 400));
  removeTyping();

  if (/help me|sos|emergency|unsafe|danger|scared|afraid|attack/.test(lower)) {
    if (/sos|activate sos|help me now/.test(lower)) {
      addMessage('bot', "SOS activated! Alerting emergency contacts...");
      setTimeout(() => activateSOS(), 500);
    } else {
      addMessage('bot', RESPONSES.unsafe());
    }
  } else if (/safety tip|tips|safe|how to stay/.test(lower)) {
    addMessage('bot', RESPONSES.safety_tips());
    const d = document.querySelector('#chatArea .msg.bot:last-child > div');
    if (d) { const c = document.createElement('div'); c.className = 'tip-chips'; c.innerHTML = `<span class="tip-chip" onclick="sendQuick('Is Lucknow safe?')">Check Lucknow</span><span class="tip-chip" onclick="sendQuick('Is Mumbai safe?')">Check Mumbai</span><span class="tip-chip" onclick="activateSOS()">Test SOS</span>`; d.appendChild(c); }
  } else if (/emergency contact|helpline|call|phone number/.test(lower)) {
    addMessage('bot', "Here are all important emergency contacts:", buildEmergencyCard());
  } else if (/high risk|most dangerous|unsafe state|worst/.test(lower)) {
    addMessage('bot', "Here's the women's safety risk overview for India:", buildHighRiskCard());
  } else if (/map|choropleth|visual|dashboard/.test(lower)) {
    addMessage('bot', "Here's the India Women Safety Intelligence Map:", buildMapCard());
  } else if (/hello|hi|hey|namaste/.test(lower)) {
    addMessage('bot', RESPONSES.greet());
  } else if (/who are you|what are you|sakhi/.test(lower)) {
    addMessage('bot', "I'm **Sakhi AI** — your intelligent women's safety companion on the India Women Safety Intelligence Platform.\n\nI can help you:\n• Check safety scores for any Indian city/state\n• Provide real-time safety tips\n• Guide you in emergencies\n• Activate SOS alerts\n\nHow can I keep you safe today?");
  } else {
    const locData = getSafetyData(lower);
    if (locData) {
      const intro = locData.level === 'high' 
        ? `⚠️ **${locData.name}** has a **high risk** safety rating. Here's what you need to know:`
        : locData.level === 'medium'
        ? `${locData.name} has a **medium risk** rating. Stay cautious:`
        : `Great news! **${locData.name}** is relatively safe with a **low risk** rating:`;
      addMessage('bot', intro, buildSafetyCard(locData, lower));
    } else {
      await sendToAI(text);
      return;
    }
  }
  isTyping = false;
}

async function sendToAI(text) {
  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        system: "You are Sakhi AI, a compassionate women's safety assistant for India. Give concise, helpful safety guidance. Focus on women's safety, emergency procedures, crime prevention, and safe travel. Keep responses under 150 words. Be warm, supportive, and professional. Do not use markdown headers, keep it conversational."
      })
    });
    const data = await response.json();
    if (data.error) {
      throw new Error(data.error);
    }
    const reply = data.reply || "I'm here to help with your safety. Could you tell me more about what you need?";
    addMessage('bot', reply);
  } catch (e) {
    addMessage('bot', "I'm here for you! For immediate help, call **112** (Emergency) or **1091** (Women Helpline). You can also ask me to check safety scores for any Indian city.");
  }
  isTyping = false;
}

function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  addMessage('user', text);
  input.value = ''; input.style.height = 'auto';
  processMessage(text);
}

function sendQuick(text) {
  addMessage('user', text);
  processMessage(text);
}

function searchLocation() {
  const val = document.getElementById('locationSearch').value.trim();
  if (!val) return;
  const text = `Is ${val} safe?`;
  addMessage('user', text);
  processMessage(text);
  document.getElementById('locationSearch').value = '';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 80) + 'px';
}

function activateSOS() {
  document.getElementById('sosOverlay').classList.add('active');
  addMessage('bot', "🚨 **SOS ACTIVATED** — Emergency services alerted. Police (100) and Women Helpline (1091) notified. Share your live location now.", buildEmergencyCard());
  speak("SOS activated. Emergency services are being alerted. Please call 112 immediately.");
}

function dismissSOS() {
  document.getElementById('sosOverlay').classList.remove('active');
}

function callEmergency() {
  window.location.href = 'tel:112';
}

function speak(text) {
  if (!ttsEnabled || !synth) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.95; u.pitch = 1.05; u.volume = 0.9;
  const voices = synth.getVoices();
  const fem = voices.find(v => v.lang.startsWith('en') && /female|woman/i.test(v.name)) || voices.find(v => v.lang.startsWith('en'));
  if (fem) u.voice = fem;
  synth.speak(u);
}

function toggleTTS() {
  ttsEnabled = !ttsEnabled;
  const btn = document.getElementById('ttsBtn');
  btn.innerHTML = ttsEnabled ? '<i class="ti ti-volume" aria-hidden="true"></i>' : '<i class="ti ti-volume-off" aria-hidden="true"></i>';
  btn.style.opacity = ttsEnabled ? '1' : '0.6';
}

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    addMessage('bot', "Voice input isn't supported in this browser. Please try Chrome or Edge for voice features.");
    return;
  }
  if (isListening) {
    recognition?.stop();
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'en-IN';
  recognition.continuous = false;
  recognition.interimResults = false;
  
  recognition.onstart = () => {
    isListening = true;
    document.getElementById('micBtn').classList.add('listening');
    document.getElementById('voiceStatus').classList.add('active');
  };
  recognition.onend = () => {
    isListening = false;
    document.getElementById('micBtn').classList.remove('listening');
    document.getElementById('voiceStatus').classList.remove('active');
  };
  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    document.getElementById('msgInput').value = transcript;
    sendMessage();
  };
  recognition.onerror = () => {
    isListening = false;
    document.getElementById('micBtn').classList.remove('listening');
    document.getElementById('voiceStatus').classList.remove('active');
  };
  recognition.start();
}

document.getElementById('locationSearch').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchLocation();
});

setTimeout(() => {
  addMessage('bot', RESPONSES.greet());
  setTimeout(() => {
    const area = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.innerHTML = `<div class="avatar"><i class="ti ti-shield-heart" aria-hidden="true"></i></div><div><div class="bubble" style="font-size:13px;">Quick actions to get started:</div><div class="tip-chips" style="margin-top:6px;">
      <span class="tip-chip" onclick="sendQuick('Is Lucknow safe?')">🔍 Is Lucknow safe?</span>
      <span class="tip-chip" onclick="sendQuick('Show safety score of Mumbai')">📊 Mumbai score</span>
      <span class="tip-chip" onclick="sendQuick('Which states are high risk?')">⚠️ High risk states</span>
      <span class="tip-chip" onclick="sendQuick('Give me safety tips')">💡 Safety tips</span>
    </div></div>`;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }, 1200);
}, 400);
</script>
<script>

function speak(text){
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-IN";
    speechSynthesis.speak(speech);
}

function startListening(){

    const recognition =
        new(window.SpeechRecognition ||
            window.webkitSpeechRecognition)();

    recognition.lang = "en-IN";

    document.getElementById("voiceOutput").innerHTML =
        "🎤 Listening...";

    recognition.start();

    recognition.onresult = function(event){

        let command =
            event.results[0][0].transcript.toLowerCase();

        document.getElementById("voiceOutput").innerHTML =
            "You said: " + command;

        // Example commands

        if(command.includes("hello")){
            speak("Hello, I am Sakhi AI. How can I help you?");
        }

        else if(command.includes("help")){
            speak("If you are in danger, please activate the SOS button.");
        }

        else if(command.includes("unsafe")){
            speak("I understand. Would you like to activate SOS?");
        }

        else if(command.includes("lucknow")){
            speak("Lucknow is available in the safety database. Please check the risk score section.");
        }

        else{
            speak("Sorry, I did not understand that.");
        }
    };
}

</script>
