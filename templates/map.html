<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>India Safety Map — Sakhi AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>
<body class="map-page-body">
  <header class="app-header">
    <div class="header-left">
      <a href="/">
        <div class="logo">
          <img src="{{ url_for('static', filename='sakhi-shield-logo-192.png') }}" alt="Sakhi AI Logo" class="logo-img">
          <span class="logo-text">Sakhi <span class="accent-text">AI</span></span>
        </div>
      </a>
    </div>
    <nav class="app-nav" id="nav">
      <a href="/" class="nav-item" id="nb-map">
        <i class="ti ti-home"></i> <span>Home</span>
      </a>
      <a href="/map" class="nav-item active" id="nb-map-page">
        <i class="ti ti-map-2"></i> <span>Map</span>
      </a>
      <a href="/analytics" class="nav-item" id="nb-analytics">
        <i class="ti ti-chart-bar"></i> <span>Analytics</span>
      </a>
      <a href="/sakhi-chat" class="nav-item" id="nb-chat">
        <i class="ti ti-message-2"></i> <span>Sakhi Chat</span>
      </a>
    </nav>
    <div class="header-right">
      <a href="/sos">
        <button class="sos-hdr-btn">
          <i class="ti ti-alert-triangle"></i> SOS Emergency
        </button>
      </a>
    </div>
  </header>

  <h1 class="map-title"><i class="ti ti-map-2"></i> India Women Safety Map</h1>
  
  <div class="map-wrapper">
    <div class="map-iframe-container">
      <iframe
        class="map-iframe"
        src="/static/india_risk_map.html"
        title="India Women Safety Risk Map"
        loading="lazy"
        allow="geolocation">
      </iframe>
    </div>
  </div>

  <div class="back-link">
    <a href="/" class="btn-secondary"><i class="ti ti-arrow-back-up"></i> Back to Home</a>
  </div>
</body>
</html>
